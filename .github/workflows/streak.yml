name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Run daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Streak Stats
        run: |
          mkdir -p streak-stats
          # Menggunakan URL original agar animasi dan warnanya sama persis seperti sebelumnya
          URL="https://github-readme-streak-stats.herokuapp.com?user=${{ github.repository_owner }}&theme=dark&ring=A855F7&fire=A855F7&currStreakNum=A855F7&hide_border=true"
          
          # Coba fetch sampai 5 kali untuk mengantisipasi 503 Timeout dari Heroku
          for i in {1..5}; do
            curl -s "$URL" > streak-stats/github-streak-stats.svg
            
            # Cek apakah file yang didownload benar-benar file SVG (bukan error page)
            if grep -q "<svg" streak-stats/github-streak-stats.svg; then
              echo "Successfully fetched SVG"
              exit 0
            fi
            
            echo "Attempt $i failed, retrying in 15 seconds..."
            sleep 15
          done
          
          echo "Gagal mengambil SVG setelah 5 kali percobaan. Mempertahankan gambar sebelumnya."
          exit 1

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f streak-stats/github-streak-stats.svg
          git diff --staged --quiet || git commit -m "Auto-update GitHub Streak Stats (Original Animated)"
          git push
