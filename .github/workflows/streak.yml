name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Run daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Clone Original Animated Engine
        run: |
          # Mengambil kode asli buatan DenverCoder1 yang memiliki animasi
          git clone https://github.com/DenverCoder1/github-readme-streak-stats.git streak-generator
          cd streak-generator
          composer install
          echo "TOKEN=${{ secrets.GITHUB_TOKEN }}" > .env

      - name: Generate SVG Locally
        run: |
          mkdir -p streak-stats
          cd streak-generator
          
          # Menjalankan PHP server di background
          php -S localhost:8000 -t src &
          SERVER_PID=$!
          
          # Tunggu sebentar sampai server menyala
          sleep 3
          
          # Unduh SVG yang sudah beranimasi dari server lokal
          curl -s "http://localhost:8000/?user=${{ github.repository_owner }}&theme=dark&ring=A855F7&fire=A855F7&currStreakNum=A855F7&hide_border=true" > ../streak-stats/github-streak-stats.svg
          
          # Matikan server
          kill $SERVER_PID
          
          # Hapus folder temporary
          cd ..
          rm -rf streak-generator
          
          # Cek hasil file
          if ! grep -q "<svg" streak-stats/github-streak-stats.svg; then
            echo "Error: SVG tidak tergenerate dengan benar!"
            exit 1
          fi

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f streak-stats/github-streak-stats.svg
          git diff --staged --quiet || git commit -m "Auto-update GitHub Streak Stats (Original Animated Engine)"
          git push
