name: Generate Snake Animation

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Snake
              uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
              with:
                  github_user_name: Izumii99
                  outputs: |
                      dist/github-contribution-grid-snake.svg
                      dist/github-contribution-grid-snake-dark.svg?palette=github-dark
              env:
                  GITHUB_TOKEN: ${{ secrets.STREAK_PAT || secrets.GITHUB_TOKEN }}

            - name: Push to Output Branch
              uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
